<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Землетрясения</title>

    <script src="JavaScript/data.js"></script>
    <script src="JavaScript/main.js"></script>
    <script src="JavaScript/table.js"></script>
    <script src="JavaScript/filter.js"></script>
    <script src="JavaScript/sort.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="JavaScript/chart.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      .chart-panel {
        max-width: 1160px;
        padding: 1rem;
        margin-top: 0.75rem;
        border: 1px solid #d7dee8;
        border-radius: 1rem;
        background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
        box-shadow: 0 12px 30px rgba(26, 61, 93, 0.08);
      }

      .chart-controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.75rem;
        align-items: end;
      }

      .chart-controls label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-weight: 600;
      }

      .chart-controls select,
      .chart-controls button {
        min-height: 42px;
      }

      #chart {
        position: relative;
        min-height: 400px;
        margin-top: 0.75rem;
        overflow-x: auto;
      }

      #chart svg {
        display: block;
        font-family: "Segoe UI", sans-serif;
      }

      .chart-tooltip {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        padding: 0.55rem 0.7rem;
        border-radius: 0.75rem;
        background: rgba(15, 35, 54, 0.92);
        color: #fff;
        font-size: 0.9rem;
        line-height: 1.35;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 12px));
        transition: opacity 0.15s ease;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="navbar navbar-expand-md bg-light navbar-light">
        <a class="navbar-brand" href="#"><img src="assets/logo.png" style="max-width: 50px;"></a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse nav nav-pills justify-content-end flex-column flex-md-row" id="menu">
          <a href="index.html" class="nav-link" aria-current="page">Главная</a>
          <a href="earthquakes.html" class="nav-link active">Землетрясения</a>
          <a href="#" class="nav-link">Вулканы</a>
          <a href="#" class="nav-link">Карта</a>
        </div>
      </div>
    </header>

    <details class="ms-3" open>
      <summary>Визуализация</summary>
      <div class="chart-panel">
        <div class="chart-controls">
          <label for="chartType">
            Тип диаграммы
            <select id="chartType" class="form-select">
              <option value="scatter">Точечная диаграмма</option>
              <option value="line">График</option>
              <option value="bar">Столбчатая диаграмма</option>
            </select>
          </label>
          <label for="chartXAxis">
            Ось X
            <select id="chartXAxis" class="form-select"></select>
          </label>
          <label for="chartYAxis">
            Ось Y
            <select id="chartYAxis" class="form-select"></select>
          </label>
          <button type="button" id="buildChartBtn" class="btn btn-primary">Построить</button>
        </div>
        <div id="chart">
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>
      </div>
    </details>

    <details class="ms-3">
      <summary>Фильтр</summary>

      <form id="filter">
        <p>
          <label for="magnFrom">Магнитуда:</label>
          от <input type="number" min="0" max="10" id="magnFrom">
          до <input type="number" min="0" max="10" id="magnTo">
        </p>

        <p>
          <label for="country">Населённый пункт</label>
          <select name="country" id="country">
            <option value="2" selected>Нет</option>
            <option value="0">Петропавловск-Камчатский</option>
            <option value="1">Северо-Курильск</option>
          </select>
        </p>

        <p>
          <label for="distanceFrom">Расстояние от населённого пункта (км):</label>
          от <input type="number" min="0" max="500" id="distanceFrom">
          до <input type="number" min="0" max="500" id="distanceTo">
        </p>

        <p>
          <label for="depthFrom">Глубина (км):</label>
          от <input type="number" min="0" max="500" id="depthFrom">
          до <input type="number" min="0" max="500" id="depthTo">
        </p>

        <p>
          <label for="dateFrom">Дата:</label>
          с <input type="date" id="dateFrom">
          до <input type="date" id="dateTo">
        </p>

        <input type="button" value="Найти" id="findBtn">
        <input type="button" value="Очистить фильтры" id="clearFilterBtn">
      </form>
    </details>

    <details class="ms-3">
      <summary>Сортировка</summary>
      <form id="sort">
        <p>Сортировать по</p>
        <p>
          <select id="fieldsFirst"></select>
          по убыванию? <input type="checkbox" id="fieldsFirstDesc">
        </p>
        <p>
          <select id="fieldsSecond"></select>
          по убыванию? <input type="checkbox" id="fieldsSecondDesc">
        </p>
        <p>
          <select id="fieldsThird"></select>
          по убыванию? <input type="checkbox" id="fieldsThirdDesc">
        </p>
        <input type="button" value="Сортировать" id="sortBtn">
        <input type="button" value="Сбросить сортировку" id="resetSortBtn">
      </form>
    </details>
    <br>

    <table cellpadding="3" cellspacing="3" id="list" class="ms-3"></table>
  </body>
</html>
